<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Publication-grade vector detection figures (contact_sheet.pdf) for the Vibe Discovery Solar System candidates and faint high-proper-motion stars." />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
  <link rel="icon" type="image/png" href="../vd-logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vibe Discovery" />
  <meta property="og:title" content="Detection Figure Gallery — Vibe Discovery" />
  <meta property="og:description" content="Publication-grade vector detection figures (contact_sheet.pdf) for every Vibe Discovery Solar System candidate and faint high-proper-motion star." />
  <meta property="og:url" content="https://foaktee.github.io/rubin-euclid-discovery/movie_gallery/" />
  <meta property="og:image" content="https://foaktee.github.io/rubin-euclid-discovery/og-thumbnail.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Vibe Discovery logo" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Detection Figure Gallery — Vibe Discovery" />
  <meta name="twitter:description" content="Publication-grade vector detection figures (contact_sheet.pdf) for every Vibe Discovery Solar System candidate and faint high-proper-motion star." />
  <meta name="twitter:image" content="https://foaktee.github.io/rubin-euclid-discovery/og-thumbnail.png" />
  <meta name="twitter:image:alt" content="Vibe Discovery logo" />
  <link rel="stylesheet" href="styles.css?v=20261125clean" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <nav class="topnav" aria-label="Portals">
        <a href="../index.html">Portal Hub</a>
        <a href="../discovery_blog/index.html">Research Blog</a>
        <a href="../eyes_3d/index.html" target="_blank" rel="noopener" class="nav-cta-3d">Launch 3D Explorer ↗</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme">◐ Dark</button>
      </nav>
    </div>
  </header>

  <section class="gallery-hero">
    <div class="gallery-hero-inner">
      <div class="hero-tag">Vibe Discovery · Vector Detection Figures</div>
      <h1 class="brand-title">Detection Figure Gallery</h1>
      <p class="hero-sub">Publication-grade vector detection figures (<code>contact_sheet.pdf</code>) for every Solar System candidate and faint high-proper-motion star.</p>
    </div>
  </section>

  <main class="page">
    <section class="filters" aria-label="Filters">
      <div class="filter-row">
        <span class="filter-label" id="group-label">Group</span>
        <div class="chip-row" id="group-chips" role="group" aria-labelledby="group-label"></div>
      </div>
      <div class="filter-grid">
        <label class="field">
          <span>Survey</span>
          <select id="filter-survey"></select>
        </label>
        <label class="field">
          <span>Sort</span>
          <select id="filter-sort"></select>
        </label>
        <label class="field field-wide">
          <span>Search</span>
          <input type="search" id="filter-q" placeholder="Target, class, designation, or survey…" autocomplete="off" />
        </label>
        <div class="field field-reset">
          <button type="button" class="btn btn-quiet" id="reset-filters">Reset filters</button>
        </div>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Loading detection figures…</p>
    <section class="grid" id="grid" aria-label="Detection figures"></section>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" id="modal-dialog">
      <header class="modal-head">
        <div class="modal-title-wrap">
          <div class="badge-row" id="modal-badges"></div>
          <h2 id="modal-title">Target</h2>
          <div class="modal-sub" id="modal-sub"></div>
        </div>
        <div class="modal-nav" aria-label="Figure navigation">
          <button type="button" class="icon-btn" id="modal-prev" aria-label="Previous target" title="Previous (←)">←</button>
          <button type="button" class="icon-btn" id="modal-next" aria-label="Next target" title="Next (→)">→</button>
          <button type="button" class="icon-btn icon-btn-close" id="modal-close" aria-label="Close" title="Close (Esc)">×</button>
        </div>
      </header>

      <div class="modal-body">
        <div class="media-frame pdf-frame">
          <iframe id="modal-pdf" class="pdf-viewer" title="Vector Detection Figure (PDF)"></iframe>
        </div>
        <div class="link-row" id="modal-links"></div>
      </div>
    </div>
  </div>

  <script src="gallery.js?v=20261125clean"></script>
</body>
</html>
